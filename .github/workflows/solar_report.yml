name: Solis Solar & Battery Telegram Report

on:
  schedule:
    # รันอัตโนมัติทุกๆ 1 ชั่วโมง (ตลอด 24 ชม.)
    - cron: '0 * * * *'
  workflow_dispatch: # กดสั่งรันเองเมื่อไหร่ก็ได้ (On-Demand)

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Solar Monitor
        env:
          SOLIS_KEY_ID: ${{ secrets.SOLIS_KEY_ID }}
          SOLIS_SECRET: ${{ secrets.SOLIS_SECRET }}
          SOLIS_INVERTER_SN: ${{ secrets.SOLIS_INVERTER_SN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BATTERY_CAPACITY_KWH: ${{ secrets.BATTERY_CAPACITY_KWH }}
          ELECTRICITY_RATE_THB: ${{ secrets.ELECTRICITY_RATE_THB }}
        run: |
          python solar_monitor.py
